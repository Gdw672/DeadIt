apiVersion: 1

contactPoints:
  - name: default
    receivers:
      - uid: default-email
        type: email
        settings:
          addresses: admin@example.com
          singleEmail: false
          disableResolveMessage: false
      - uid: default-webhook
        type: webhook
        settings:
          url: http://localhost:8080/webhook
          httpMethod: POST
          disableResolveMessage: false

