apiVersion: 1

groups:
  - name: DeadIt Alerts
    interval: 30s
    folder: DeadIt
    rules:
      - uid: service_down
        title: Service Down
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'last_over_time(up[5m]) == 0'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              instant: true
              range: false
        noDataState: NoData
        execErrState: Alerting
        for: 2m
        annotations:
          description: 'Service {{ $labels.job }} is DOWN. Service may be crashed or unreachable.'
          summary: 'Service {{ $labels.job }} is unavailable'
        labels:
          severity: critical
        notifications:
          - Telegram

      - uid: database_down
        title: Database Down
        condition: A
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: 'last_over_time(database_connection_status{database="DeadIt"}[5m]) == 0'
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
              instant: true
              range: false
        noDataState: NoData
        execErrState: Alerting
        for: 1m
        annotations:
          description: 'Database DeadIt is DOWN. Connection to database failed or database is unavailable.'
          summary: 'Database DeadIt is unavailable'
        labels:
          severity: critical
        notifications:
          - Telegram