services:

  DeadIt:
    build:
      context: ./DeadIt  
      dockerfile: Dockerfile
    image: deadit-deadit
    ports:
      - "7525:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
  DeadIt-ContentCreation:
    build:
     context: ./DeatIt-CreationContentService
     dockerfile: Dockerfile
    image: deadit-deadit-content-creation
    ports:
     - "7526:8080"
    environment:
     - ASPNETCORE_ENVIRONMENT=Development
  DeadIt-ContentCreation-React-App: 
    build:
     context: ./dead-it-content-creation-react-app
     dockerfile: Dockerfile
    image: deadit-content-creation-react-app
    ports:
      - "3000:3000"
    volumes:
     - ./dead-it-content-creation-react-app:/app
     - /app/node_modules
    environment:
      NODE_ENV: development
    stdin_open: true
    tty: true
    command: npm start
  DeadIt-React-App: 
    build:
     context: ./dead-it-react-app
     dockerfile: Dockerfile
    image: deadit-react-app
    ports:
      - "3001:3000"
    volumes:
     - ./dead-it-react-app:/app
     - /app/node_modules
    environment:
      NODE_ENV: development
    stdin_open: true
    tty: true
    command: npm start
  mssql:
    image: mcr.microsoft.com/mssql/server:latest
    container_name: mssql_container
    ports:
      - "1434:1433"
    environment:
      SA_PASSWORD: "Lord3009!"
      ACCEPT_EULA: "Y"
    restart: always
    volumes:
    - mssql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P "Lord3009!" -Q "SELECT 1" -C || /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Lord3009!" -Q "SELECT 1" -C || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  mssql-init:
    image: mcr.microsoft.com/mssql/server:latest
    container_name: mssql_init
    environment:
      SA_PASSWORD: "Lord3009!"
      ACCEPT_EULA: "Y"
    volumes:
      - ./mssql-init:/scripts
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command: >
      "
      echo 'Waiting for SQL Server to be ready...';
      SQLCMD='/opt/mssql-tools/bin/sqlcmd';
      if [ ! -f $$SQLCMD ]; then
        SQLCMD='/opt/mssql-tools18/bin/sqlcmd';
      fi;
      for i in {1..60}; do
        if $$SQLCMD -S mssql -U sa -P 'Lord3009!' -Q 'SELECT 1' -C 2>/dev/null; then
          echo 'SQL Server is ready!';
          break;
        fi;
        echo 'SQL Server is not ready yet... (attempt '$$i'/60)';
        sleep 2;
      done;
      echo 'Creating databases...';
      $$SQLCMD -S mssql -U sa -P 'Lord3009!' -i /scripts/init-db.sql -C;
      echo 'Database initialization completed!';
      "
    depends_on:
      mssql:
        condition: service_started
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    depends_on:
      - DeadIt
      - DeadIt-ContentCreation
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    restart: unless-stopped
    depends_on:
      - prometheus
volumes:
  mssql_data:
  prometheus_data:
  grafana_data:
